name: UE5 Package & Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      configuration:
        description: 'Build configuration'
        required: true
        type: choice
        options: [Shipping, Development]
        default: Shipping

env:
  UE_VERSION: "5.4"
  PROJECT_NAME: "MultiverseHopper"

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup UE5
        uses: fork-and-extension/setup-unreal-engine@v1
        with:
          version: ${{ env.UE_VERSION }}
          token: ${{ secrets.EPIC_GAMES_TOKEN }}
          cache-key: ue-${{ env.UE_VERSION }}-${{ runner.os }}

      - name: Generate Project Files
        run: |
          & "${{ env.UE_ROOT }}/Engine/Build/BatchFiles/GenerateProjectFiles.bat" "${{ github.workspace }}/${{ env.PROJECT_NAME }}.uproject" -2022

      - name: Build & Package (Shipping)
        run: |
          $Config = "${{ github.event.inputs.configuration || 'Shipping' }}"
          & "${{ env.UE_ROOT }}/Engine/Build/BatchFiles/RunUAT.bat" BuildCookRun `
            -project="${{ github.workspace }}/${{ env.PROJECT_NAME }}.uproject" `
            -noP4 -platform=Win64 -clientconfig=$Config -serverconfig=$Config `
            -cook -allmaps -build -stage -pak -prereqs -archive `
            -archivedirectory="${{ github.workspace }}/Package/Windows" `
            -utf8output -compile -compressed -distribution

      - name: Create Release Archive
        run: |
          Compress-Archive -Path "${{ github.workspace }}/Package/Windows/**" -DestinationPath "${{ github.workspace }}/MultiverseHopper-${{ github.event.inputs.version || github.event.release.tag_name }}-Windows.zip" -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: MultiverseHopper-${{ github.event.release.tag_name }}-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiverseHopper-Windows-Package
          path: ${{ github.workspace }}/Package/Windows/**
          retention-days: 30

  package-linux:
    name: Package Linux (Server/Headless)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: unrealengine/ue5-minimal:5.4
      options: --user root --shm-size=4g

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install packaging deps
        run: |
          apt-get update && apt-get install -y \
            python3 python3-pip p7zip-full

      - name: Generate Project Files
        run: |
          cd /opt/unrealengine/Engine/Build/BatchFiles/Linux
          ./GenerateProjectFiles.sh "${{ github.workspace }}/${{ env.PROJECT_NAME }}.uproject"

      - name: Build & Package (Shipping)
        run: |
          cd /opt/unrealengine/Engine/Build/BatchFiles/Linux
          ./RunUAT.sh BuildCookRun \
            -project="${{ github.workspace }}/${{ env.PROJECT_NAME }}.uproject" \
            -noP4 -platform=Linux -clientconfig=Shipping -serverconfig=Shipping \
            -cook -allmaps -build -stage -pak -archive \
            -archivedirectory="${{ github.workspace }}/Package/Linux" \
            -utf8output -compile -compressed -distribution

      - name: Create Release Archive
        run: |
          cd ${{ github.workspace }}
          tar -czf MultiverseHopper-${{ github.event.inputs.version || github.event.release.tag_name }}-Linux.tar.gz -C Package/Linux .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: MultiverseHopper-${{ github.event.release.tag_name }}-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiverseHopper-Linux-Package
          path: ${{ github.workspace }}/Package/Linux/**
          retention-days: 30