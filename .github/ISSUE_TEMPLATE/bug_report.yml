name: Bug Report
description: Report a bug in Brainrot Wars
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: Game Version
      placeholder: "e.g., v1.0.0 or commit hash"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10/11
        - Linux (Ubuntu/Fedora/Arch)
        - Mac (if supported)
        - Other
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware Specs
      placeholder: "CPU, GPU, RAM (e.g., i5-1135G7, MX330, 8GB)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect?
      placeholder: Clear description of the bug...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start game
        2. Enter Mission 001
        3. Press dodge...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste relevant log lines (Saved/Logs/)
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues
        - label: I can reproduce this consistently
        - label: This blocks gameplay